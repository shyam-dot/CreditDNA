services:
  - type: web
    name: creditdna-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIREBASE_PROJECT_ID
        value: credit-dna
      - key: DEBUG
        value: "true"
